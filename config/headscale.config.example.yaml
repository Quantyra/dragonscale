# Example Headscale configuration for Dragonscale.
# Render this template into a private config before use.

server_url: __DRAGONSCALE_SERVER_URL__
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 127.0.0.1:9090

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite

policy:
  mode: file
  path: /etc/headscale/acl.hujson

dns:
  magic_dns: true
  base_domain: dragonscale.kuzuryu.ai
  nameservers:
    global:
      - 1.1.1.1
      - 8.8.8.8

derp:
  server:
    enabled: false
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  auto_update_enabled: true
  update_frequency: 24h

oidc:
  issuer: https://accounts.google.com
  client_id: __DRAGONSCALE_OIDC_CLIENT_ID__
  client_secret: __DRAGONSCALE_OIDC_CLIENT_SECRET__
  pkce:
    enabled: true
  scope:
    - openid
    - profile
    - email
  allowed_users:
    - __DRAGONSCALE_ALLOWED_USER_1__
    - __DRAGONSCALE_ALLOWED_USER_2__
  expiry: 180d

log:
  format: text
  level: info
